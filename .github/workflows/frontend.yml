name: Deploy BastaStorage Frontend

on:
  push:
    branches: [main]
    paths:
      - "Frontend/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Frontend

    env:
      S3_BUCKET_NAME: bastastorage-frontend
      CLOUDFRONT_DISTRIBUTION_ID: E18X59ESKDC6O1
      VITE_BACKEND_BASE_URL: https://api.bastastorage.me
      VITE_CLIENT_URL_1: https://bastastorage.me
      VITE_CLIENT_URL_2: https://www.bastastorage.me
      VITE_GOOGLE_API_KEY: ${{ secrets.VITE_GOOGLE_API_KEY }}

    steps:
      - name: Clone frontend repository ( Checkout code )
        uses: actions/checkout@v4
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "23"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to S3
        run: aws s3 sync "dist/" s3://$S3_BUCKET_NAME --delete --region ${{ secrets.AWS_REGION }}

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/index.html"

      - name: Deployment complete
        run: echo "Frontend Deployed Successfully..."